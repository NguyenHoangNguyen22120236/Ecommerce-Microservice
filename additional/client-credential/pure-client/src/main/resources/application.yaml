spring:
  application:
    name: pure-client
  security:
    oauth2:
      client:
        registration:
          keycloak-client:
            provider: keycloak
            client-id: oauth2-client-credential

            client-secret:

            scope:
              - openid

            authorization-grant-type: client_credentials

        provider:
          keycloak-client:
            token-uri: http://localhost:8443/realms/oauth2-demos/protocol/openid-connect/token

server:
  port: 8081


service2:
  url: http://localhost:8082